spark.master                     spark://master:7077
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://master:9000/spark-logs
spark.history.fs.logDirectory    hdfs://master:9000/spark-logs

# Cấu hình tài nguyên mặc định cho Executor tốn dùng trên mỗi Worker (Slave)
spark.executor.memory            2g
spark.executor.cores             2

# Cấu hình tài nguyên mặc định cho Driver (Master)
spark.driver.memory              1g

# Tùy chỉnh YARN nếu bạn muốn chạy job Spark qua YARN thay vì Spark Standalone cluster:
spark.yarn.am.memory             1g
